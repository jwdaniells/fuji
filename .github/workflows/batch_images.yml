name: Batch Download Recipe Images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: pip install requests
      - name: Run batch image downloader
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/batch_download_images.py
