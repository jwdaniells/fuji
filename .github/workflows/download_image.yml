name: Download Recipe Image
on:
  repository_dispatch:
    types: [download_image]
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image and update data.json
        env:
          RECIPE_NAME: ${{ github.event.client_payload.name }}
          RECIPE_ID:   ${{ github.event.client_payload.id }}
          IMAGE_URL:   ${{ github.event.client_payload.url }}
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import os, json, base64, urllib.request, ssl, time

          name = os.environ['RECIPE_NAME']
          rid  = os.environ['RECIPE_ID']
          url  = os.environ['IMAGE_URL']
          tok  = os.environ['GH_TOKEN']
          repo = 'jwdaniells/fuji'
          api  = 'https://api.github.com/repos/' + repo + '/contents'
          hdrs = {'Authorization': 'token ' + tok, 'Content-Type': 'application/json'}

          def api_get(path):
              req = urllib.request.Request(api + path, headers=hdrs)
              with urllib.request.urlopen(req) as r: return json.loads(r.read())

          def api_put(path, data):
              req = urllib.request.Request(api + path, data=json.dumps(data).encode(),
                  method='PUT', headers=hdrs)
              with urllib.request.urlopen(req) as r: return json.loads(r.read())

          # 1. Download image
          ctx = ssl.create_default_context()
          ireq = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0',
              'Referer': 'https://fujixweekly.com/'})
          with urllib.request.urlopen(ireq, context=ctx, timeout=30) as r:
              img_bytes = r.read()
          print(f'Downloaded {len(img_bytes):,} bytes')

          # 2. Commit image via API
          img_path = f'/images/{rid}.jpg'
          img_b64  = base64.b64encode(img_bytes).decode()
          try:
              existing = api_get(img_path)
              img_sha  = existing['sha']
              api_put(img_path, {'message': f'Update image: {name}',
                                  'content': img_b64, 'sha': img_sha})
          except Exception:
              api_put(img_path, {'message': f'Add image: {name}', 'content': img_b64})
          print(f'Committed image: {rid}.jpg')

          # 3. Update data.json via API (with retry for concurrent runs)
          for attempt in range(5):
              try:
                  d = api_get('/recipes/data.json')
                  data = json.loads(base64.b64decode(d['content'].replace('\n','')))
                  for recipe in data['recipes']:
                      if recipe['name'] == name:
                          recipe['image'] = rid + '.jpg'
                          print(f'Updated data.json for: {name}')
                          break
                  new_content = base64.b64encode(json.dumps(data, indent=2).encode()).decode()
                  api_put('/recipes/data.json', {
                      'message': f'Update image status: {name}',
                      'content': new_content,
                      'sha': d['sha']})
                  print('data.json committed')
                  break
              except Exception as e:
                  print(f'Attempt {attempt+1} failed: {e}')
                  if attempt < 4: time.sleep(3 + attempt * 2)
          "
